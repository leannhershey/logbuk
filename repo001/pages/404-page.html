<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LogBUk – Page not available</title>
  <link rel="icon" href="../assets/images/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
  <style>
    /* --- 404 page ---------------------------------------------------------
       Self-contained on purpose: every rule below is inline so this page
       still looks right if the CSS bundle fails to load, and so reaching it
       never depends on the database or on any script. */
    body.err404 {
      background: var(--grad-sidebar);
      font-family: "Poppins", "Segoe UI", system-ui, sans-serif;
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .err404__card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 18px 45px rgba(4, 20, 60, 0.35);
      padding: 40px 36px 32px;
      width: min(560px, 100%);
      text-align: center;
    }
    .err404__code {
      font-size: 4.6rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -3px;
      background: linear-gradient(135deg, #ff5a0f 0%, #ff8a3d 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 0;
    }
    .err404__badge {
      display: inline-block;
      margin: 12px 0 18px;
      padding: 5px 14px;
      border-radius: 999px;
      background: #ffe9dc;
      color: #c2410c;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .err404__title { margin: 0 0 10px; font-size: 1.35rem; color: #111; }
    .err404__text  { margin: 0 auto 6px; font-size: .86rem; line-height: 1.6; color: #6b7280; max-width: 42ch; }
    .err404__feature {
      display: inline-block;
      font-weight: 700;
      color: #0b3c9c;
      background: #eef4fd;
      border-radius: 6px;
      padding: 1px 8px;
    }
    .err404__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 26px;
    }
    .err404__btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 20px;
      border-radius: 10px;
      font: inherit;
      font-size: .82rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: 2px solid transparent;
      transition: filter .15s ease, transform .1s ease, background .15s ease;
    }
    .err404__btn:active { transform: translateY(1px); }
    .err404__btn--primary { background: linear-gradient(135deg, #0b3c9c 0%, #3a6fd0 100%); color: #fff; }
    .err404__btn--primary:hover { filter: brightness(1.1); }
    .err404__btn--outline { background: #fff; color: #0b3c9c; border-color: #c9d8f2; }
    .err404__btn--outline:hover { background: #eef4fd; }
    .err404__btn--ghost { background: transparent; color: #6b7280; }
    .err404__btn--ghost:hover { color: #111; }
    .err404__hint {
      margin: 22px 0 0;
      padding-top: 16px;
      border-top: 1px solid #eef0f4;
      font-size: .72rem;
      color: #9aa1ac;
    }
  </style>
</head>
<body class="err404">
  <main class="err404__card" role="main">
    <p class="err404__code" aria-hidden="true">404</p>
    <span class="err404__badge">Still in development</span>

    <h1 class="err404__title">This page isn’t available yet</h1>

    <p class="err404__text">
      You followed a link to
      <span class="err404__feature" id="err404Feature">a module</span>
      that hasn’t been built yet. The link stays in place so the navigation
      matches the final system, but the screen behind it is coming in a later module.
    </p>

    <div class="err404__actions">
      <a class="err404__btn err404__btn--primary" href="dashboard.html">
        <span aria-hidden="true">&#8592;</span> Back to Dashboard
      </a>
      <a class="err404__btn err404__btn--outline" href="occupants.php">Occupants</a>
      <a class="err404__btn err404__btn--ghost" href="../index.html">Home</a>
    </div>

    <p class="err404__hint" id="err404Path">Requested: unknown</p>
  </main>

  <script>
    /* Fill in which module was clicked and what was asked for.
       Purely cosmetic — the page reads fine with the defaults above. */
    (function () {
      var names = {
        dashboard: "Dashboard",
        occupants: "Occupants",
        rooms:     "Rooms",
        logs:      "Dormitory Logs",
        reports:   "Reports",
        register:  "Register Occupant",
        edit:      "Edit Occupant"
      };

      var params = new URLSearchParams(window.location.search);
      var key    = (params.get("from") || "").toLowerCase();
      var label  = names[key] || "a module";

      var feature = document.getElementById("err404Feature");
      if (feature) feature.textContent = label;

      if (names[key]) document.title = "LogBUk – " + names[key] + " (not available yet)";

      var path = params.get("path");
      var slot = document.getElementById("err404Path");
      if (slot) {
        slot.textContent = path
          ? "Requested: " + path
          : "Requested: " + label + " · 404";
      }
    })();
  </script>
</body>
</html>
